# Runs the open-source Google Maps scraper (gosom/google-maps-scraper) locally.
# Web/API mode on http://localhost:8080. The image has NO built-in auth, so we bind
# to 127.0.0.1 ONLY — that localhost binding is the security boundary. Do not change
# the port mapping to 0.0.0.0 / a public interface without putting an auth proxy in front.

services:
  google-maps-scraper:
    # Pinned to a known-good release for reproducibility (bump deliberately).
    # The published image is linux/amd64. On Apple Silicon (M1/M2/M3) it runs under
    # emulation; if it won't start, UNCOMMENT the 'platform' line below.
    image: gosom/google-maps-scraper:v1.18.1
    # platform: linux/amd64
    container_name: gmaps-scraper
    restart: unless-stopped
    command: ["-web", "-data-folder", "/gmapsdata"]
    # Not published directly — the 'web' proxy below serves it on localhost:8080.
    expose:
      - "8080"
    volumes:
      - gmaps_data:/gmapsdata    # job results persist here
      - gmaps_cache:/opt         # Playwright browser cache (faster restarts)

  enrichment:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "-u", "/service/enrichment.py"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 32
    environment:
      ENRICHMENT_DATA: /data/saved
    volumes:
      - ./services:/service:ro
      - enrichment_data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      - google-maps-scraper
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'

  # nginx in front of the scraper: serves the new front-end (./frontend) at "/", keeps the
  # original UI at "/classic" (patched — its htmx 1.9.6 dropped the job table rows), and
  # proxies the API unchanged. Routing lives in nginx.conf.
  web:
    image: nginx:1.27-alpine
    container_name: gmaps-web
    restart: unless-stopped
    depends_on:
      - google-maps-scraper
      - enrichment
    ports:
      - "127.0.0.1:8080:80"     # localhost only — see warning above
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./scraper-proxy.inc:/etc/nginx/conf.d/scraper-proxy.inc:ro
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  gmaps_data:
  gmaps_cache:
  enrichment_data:
