# localhost:8080
#   /          -> front-end, "Mapa" mode (./frontend/index.html), talks to /api/v1
#   /painel    -> front-end, "Painel" (dashboard) mode (./frontend/painel.html)
#   /app/*     -> front-end assets
#   /classic   -> original scraper UI (patched, see below)
#   everything else (/api, /jobs, /scrape, /static, /download…) -> scraper container
server {
    listen 80;
    client_max_body_size 50m;

    location /enrichment/ {
        proxy_pass http://enrichment:8090;
        proxy_set_header Host $http_host;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /painel {
        root /usr/share/nginx/html;
        try_files /painel.html =404;
        add_header Cache-Control "no-cache";
    }

    location /app/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-cache";
    }

    location = /classic {
        proxy_pass http://google-maps-scraper:8080/;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    location / {
        proxy_pass http://google-maps-scraper:8080;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }
}
